name: linux

# Verifies the Linux port (see LINUX_PORT.md). The tray-app crate is a
# standalone crate, not a workspace member, so the workspace `cargo check`
# alone does NOT cover its Linux wiring — the `app` step below is the one
# that finally compiler-verifies it (this VM cannot run it: no GTK/WebKit
# dev libs here).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (workspace + tray app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check workspace (nxcore, nxtun, nxpump, simphone, e2e)
        working-directory: pc
        run: cargo check
      - name: Test Linux platform layer + engine
        working-directory: pc
        run: cargo test -p nxcore -p nxtun
      - name: Run the engine end-to-end suite
        run: bash pc/test-e2e.sh
      - name: Check tray app crate on Linux host
        run: cargo check --manifest-path pc/app/src-tauri/Cargo.toml

  windows-cross-check:
    name: Windows cross-check (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Check workspace for Windows target
        working-directory: pc
        run: cargo check --target x86_64-pc-windows-gnu
