[package]
name = "nexlink-app"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "NexLink PC tray app (settings window + Connect) built on the nxcore engine — Wintun backend on Windows, TUN backend on Linux."

# Standalone crate: intentionally not a member of the pc/ workspace so the
# core stays fast to build and test on its own.
[workspace]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
nxcore = { path = "../../crates/nxcore" }

# Windows only: safe bindings to the WinTun driver (the Wintun backend
# lives in src/wintun_backend.rs, also #[cfg(windows)]). The DLL itself is
# bundled by the installer (backlog item 3); `wintun::load()` looks for
# wintun.dll next to the exe.
[target.'cfg(windows)'.dependencies]
wintun = "0.5"

# Linux only: the platform layer (TUN adapter backend + route/DNS
# management) from the pc/ workspace, behind the same API as the
# Windows backend + routes modules.
[target.'cfg(target_os = "linux")'.dependencies]
nxtun = { path = "../../crates/nxtun" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
